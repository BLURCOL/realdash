<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
 --fu:#D32966;--fu-l:#FF366A;--fu-d:#A81D4E;--fu-s:#FDEFF4;--fu-s2:#FBE0EA;
 --am:#E8B33D;--am-l:#FFE499;--am-s:#FFF8E8;
 --az:#2E7FA8;--az-l:#8FCDE8;--az-s:#DEF2FC;
 --gr:#1F9D6B;--gr-s:#E4F4ED;--rd:#C9453B;--rd-s:#FAE9E7;
 --ink:#12121A;--ink2:#3A3A46;--ink3:#767684;--ink4:#A5A5B2;
 --bg:#F5F5F7;--card:#FFFFFF;--line:#E5E5EA;--line2:#F0F0F3;--fill:#EFEFF2;
 --sh:0 1px 2px rgba(18,18,26,.04),0 4px 14px rgba(18,18,26,.05);
 --sh2:0 8px 30px rgba(18,18,26,.11);
 --r:13px;
}
html{scroll-behavior:smooth;}
body{font-family:'Albert Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);
 color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14.5px;line-height:1.45;}
.num{font-variant-numeric:tabular-nums;}
.ser{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;}
::selection{background:var(--fu);color:#fff;}
.wrap{max-width:1480px;margin:0 auto;padding:0 26px;}

/* HEADER */
.hd{position:sticky;top:0;z-index:70;background:var(--fu);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.06);}
.hd-in{max-width:1480px;margin:0 auto;padding:11px 26px;display:flex;align-items:center;gap:18px;}
.hd img.lg{height:42px;width:auto;display:block;flex-shrink:0;}
.htit{border-left:1px solid rgba(255,255,255,.28);padding-left:18px;line-height:1.2;min-width:0;flex:1;}
.htit b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;}
.htit span{font-size:12px;color:rgba(255,255,255,.68);font-weight:500;}
.hact{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.lang{display:flex;background:rgba(255,255,255,.16);border-radius:99px;padding:3px;}
.lang button{background:none;border:0;color:rgba(255,255,255,.72);font:inherit;font-size:11px;font-weight:700;
 letter-spacing:.08em;padding:5px 11px;border-radius:99px;cursor:pointer;transition:.16s;}
.lang button.on{background:#fff;color:var(--fu);}
.btn{font:inherit;font-size:12.5px;font-weight:600;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);
 color:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
.btn:hover{background:#fff;color:var(--fu);border-color:#fff;}
.btn.solid{background:#fff;color:var(--fu);border-color:#fff;}
.btn.solid:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn.gh{background:transparent;border-color:var(--line);color:var(--ink2);}
.btn.gh:hover{border-color:var(--fu);color:var(--fu);background:#fff;}

/* TABS */
.tabs{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:65;}
.tabs-in{max-width:1480px;margin:0 auto;padding:0 26px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
.tabs-in::-webkit-scrollbar{display:none;}
.tabs button{background:none;border:0;font:inherit;font-size:13px;font-weight:500;color:var(--ink3);padding:14px 15px;
 cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.15s;display:flex;align-items:center;gap:7px;}
.tabs button:hover{color:var(--ink);}
.tabs button.on{color:var(--fu);border-bottom-color:var(--fu);font-weight:700;}
.tabs button i{font-style:normal;font-size:14px;opacity:.85;}

/* BAR */
.bar{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
 padding:12px 15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 4px;font-size:12.5px;}
.bar .it{display:flex;align-items:center;gap:7px;color:var(--ink3);}
.bar .it b{color:var(--ink);font-weight:600;}
.bar .sep{width:1px;height:20px;background:var(--line);}
.bar .sp{flex:1;}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.03em;
 padding:4px 9px;border-radius:6px;background:var(--fill);color:var(--ink3);}
.chip.fu{background:var(--fu-s);color:var(--fu);}
.chip.gr{background:var(--gr-s);color:#136c48;}
.chip.am{background:var(--am-s);color:#8a6410;}
.chip.rd{background:var(--rd-s);color:#a33228;}

/* PAGE */
.page{display:none;padding-bottom:60px;}
.page.on{display:block;}
.slab{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink4);margin:30px 2px 12px;}
.slab:first-child{margin-top:20px;}
.slab b{color:var(--fu);}

/* CARD */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px;}
.card.p0{padding:0;overflow:hidden;}
.chd{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.ct{font-size:13.5px;font-weight:700;letter-spacing:-.01em;}
.ct s{display:block;font-size:11.5px;color:var(--ink3);font-weight:500;text-decoration:none;margin-top:3px;line-height:1.45;}

/* GOOGLE */
.gact{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px;}
.gbtn{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;text-decoration:none;
 background:var(--card);border:1px solid var(--line);color:var(--ink2);border-radius:10px;padding:11px 16px;transition:.16s;}
.gbtn:hover{border-color:var(--fu);color:var(--fu);box-shadow:var(--sh);}
.gbtn.hot{background:var(--fu);border-color:var(--fu);color:#fff;}
.gbtn.hot:hover{background:var(--fu-d);border-color:var(--fu-d);color:#fff;}
.gcopy{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;}
.gcopy code{flex:1;min-width:200px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
 background:rgba(255,255,255,.65);border:1px solid rgba(0,0,0,.07);border-radius:8px;padding:9px 11px;
 overflow-x:auto;white-space:nowrap;color:var(--ink);}
.gkrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;}
.gkin{flex:1;min-width:220px;font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:9px;
 padding:9px 12px;outline:0;background:var(--card);color:var(--ink);}
.gkin:focus{border-color:var(--fu);box-shadow:0 0 0 3px var(--fu-s);}
.gkmask{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--ink3);background:var(--fill);
 border-radius:7px;padding:7px 10px;}
.gmsg2{font-size:13px;color:var(--ink3);padding:18px;text-align:center;background:var(--bg);border-radius:10px;margin-top:16px;}
.gmsg2.err{color:var(--rd);background:var(--rd-s);}
.grevs{display:flex;flex-direction:column;gap:9px;}
.grev{background:var(--bg);border-radius:10px;padding:13px 15px;}
.grh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px;font-size:12.5px;}
.gstars{color:var(--am);font-size:12px;letter-spacing:1px;}

function BOOT(PUB,I18N){
var TACO_BASE=String.fromCharCode(84,46,32,65,115,97,100,97);
'use strict';
var L='es', DATA=JSON.parse(JSON.stringify(PUB)), CUSTOM=false, PAGE='hist';
var VIEW={cat:'val',prot:'all',day:'d',dn:'28'};
var SORT={items:{k:'v',d:-1},mods:{k:'v',d:-1}};
var Q={items:'',mods:''};

var C={fu:'#D32966',ful:'#FF366A',fud:'#A81D4E',am:'#E8B33D',aml:'#FFE499',
       az:'#2E7FA8',azl:'#8FCDE8',ink:'#12121A',gr:'#1F9D6B',rd:'#C9453B',line:'#E5E5EA'};

function t(k){var s=(I18N[L]&&I18N[L][k]);return s===undefined?k:s;}
function loc(){return L==='en'?'en-US':'es-CO';}
function money(n,d){d=d||0;var neg=n<0;var s='$'+Math.abs(Number(n)).toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d});return neg?('-'+s):s;}
function m0(n){return money(Math.round(n),0);}
function m2(n){return money(n,2);}
function num(n){return Number(n).toLocaleString(loc());}
function pct(n,d){d=(d===undefined)?1:d;return Number(n).toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d})+'%';}
function fill(s,o){return s.replace(/\{(\w+)\}/g,function(_,k){return o[k]!==undefined?o[k]:'';});}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}

function obs(nodes,cls){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add(cls||'in');io.unobserve(e.target);}});},{threshold:0,rootMargin:'0px 0px -5% 0px'});
  Array.prototype.forEach.call(nodes.length!==undefined?nodes:[nodes],function(n){io.observe(n);});
}

/* ---------- BARS ---------- */
function bars(host,rows){
  host.innerHTML='';
  var wrap=el('div','brs');
  var vals=rows.filter(function(r){return !r.cut;}).map(function(r){return Math.abs(r.v)||0;});
  var max=Math.max.apply(null,vals)||1;
  rows.forEach(function(r,i){
    if(r.cut){var c=el('div','cut');c.innerHTML='<div></div><i><span>'+esc(r.cut)+'</span></i>';wrap.appendChild(c);return;}
    var b=el('div','br');
    b.innerHTML='<span class="l">'+r.k+'</span>'+
      '<div class="t"><div class="f" style="background:'+(r.color||C.fu)+';width:'+Math.max(0.7,Math.abs(r.v)/max*100)+'%;transition-delay:'+(i*0.03)+'s"></div></div>'+
      '<span class="v">'+r.vt+'</span><span class="p">'+(r.pct!==undefined?(typeof r.pct==='string'?r.pct:pct(r.pct)):'')+'</span>'+
      (r.tip?'<div class="tip">'+r.tip+'</div>':'');
    wrap.appendChild(b);
  });
  host.appendChild(wrap);obs(wrap.querySelectorAll('.br'));
}
/* ---------- COLUMNS ---------- */
function cols(host,rows,opt){
  opt=opt||{};host.innerHTML='';
  var c=el('div','cols');
  if(opt.gap)c.style.setProperty('--gp',opt.gap);
  if(opt.h)c.style.setProperty('--ch',opt.h);
  var max=Math.max.apply(null,rows.map(function(r){return r.v;}))||1;
  rows.forEach(function(r,i){
    var d=el('div','col'+(r.v<=0?' zero':''));
    d.innerHTML='<div class="nb" style="color:'+(r.v<=0?'#A5A5B2':C.ink)+'">'+(r.nb!==undefined?r.nb:m0(r.v))+'</div>'+
      '<div class="bx" style="height:'+(r.v<=0?2:Math.max(3,r.v/max*100))+'%;background:'+(r.color||(r.v<=0?C.line:C.fu))+';transition-delay:'+(i*0.028)+'s"></div>'+
      '<div class="lb">'+r.k+'</div>';
    c.appendChild(d);
  });
  host.appendChild(c);obs(c);
}

/* ---------- KPIs ---------- */
function kpiRow(host,list){
  host.innerHTML='';
  list.forEach(function(x){
    var d=el('div','kpi '+(x.c||''));
    d.innerHTML='<div class="k">'+x.k+'</div><div class="v">'+x.v+'</div>'+(x.s?'<div class="s">'+x.s+'</div>':'');
    host.appendChild(d);
  });
}
function rKpiMain(){
  var s=DATA.sum;
  kpiRow($('kpi'),[

/* ============ CSV UPLOAD ENGINE ============ */
var FILES={};
function decode(buf){
  var u=new Uint8Array(buf);
  if(u.length>1&&u[0]===0xFF&&u[1]===0xFE) return new TextDecoder('utf-16le').decode(buf);
  if(u.length>1&&u[0]===0xFE&&u[1]===0xFF) return new TextDecoder('utf-16be').decode(buf);
  var s=new TextDecoder('utf-8').decode(buf);
  return s.charCodeAt(0)===0xFEFF?s.slice(1):s;
}
function pm(s){ /* parse money es-CO */
  if(s===undefined||s===null) return 0;
  s=String(s).replace(/[$" ]/g,'').replace(/US/g,'').trim();
  var neg=s.charAt(0)==='-'; if(neg) s=s.slice(1);
  s=s.replace(/\./g,'').replace(',','.');
  var v=parseFloat(s); if(isNaN(v)) return 0;
  return neg?-v:v;
}
function pn(s){
  if(s===undefined||s===null) return 0;
  var v=parseInt(String(s).replace(/[." ]/g,'').replace(',','.'),10);
  return isNaN(v)?0:v;
}
function splitRows(txt,delim){
  var rows=[],cur=[],f='',q=false;
  for(var i=0;i<txt.length;i++){
    var c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===delim){cur.push(f);f='';}
    else if(c==='\n'){cur.push(f);rows.push(cur);cur=[];f='';}
    else if(c!=='\r') f+=c;
  }
  if(f!==''||cur.length){cur.push(f);rows.push(cur);}
  return rows;
}
function sniff(txt){
  var head=txt.slice(0,900);
  if(/Nombre del art|Item Name/i.test(head)&&/Categor|Category/i.test(head)) return 'items';
  if(/Conjunto de modificadores|Modifier Set/i.test(head)) return 'mods';
  if(/tendencias-venta|sales-trend/i.test(head)) return 'trend';
  if(/M.todo de pago|Payment Method/i.test(head)) return 'pay';
  if(/Resumen de ventas|Sales Summary/i.test(head)) return 'sum';
  if(/^Categor/i.test(head.trim())) return 'cats';
  return null;
}

function parseItems(txt,D){
  var rows=splitRows(txt,'\t'); if(rows.length<2) return;
  var H=rows[0].map(function(x){return x.trim();});
  var iN=H.indexOf('Nombre del artículo'); if(iN<0) iN=0;
  var iC=H.indexOf('Categoría'); if(iC<0) iC=3;
  var iQ=H.indexOf('Artículos vendidos'); if(iQ<0) iQ=4;
  var iV=H.indexOf('Ventas brutas'); if(iV<0) iV=5;
  var cat={},pa={},an={},sinc={q:0,v:0},tacoonly={},fmt={},sal=[],TOT=0;
  for(var r=1;r<rows.length;r++){
    var R=rows[r]; if(R.length<=iV) continue;
    var name=(R[iN]||'').trim(), c0=(R[iC]||'NA').trim();
    var q=pn(R[iQ]), v=pm(R[iV]);
    if(name.indexOf('---')===0) q=0;
    var c=c0.indexOf('FT-')===0?'Food Truck':(CATGRP[c0]||c0);
    if(!cat[c]) cat[c]={q:0,v:0,raw:c};
    cat[c].q+=q; cat[c].v+=v; TOT+=v;
    if(c0==='Salsas'||c0==='FT-Salsas') sal.push({k:name,q:q,v:v});
    if(name===TACO_BASE) fmt.Taco={q:q,v:v};
    if(name==='B. Ch Asada') fmt.BCh={q:q,v:v};
    if(name==='B. Asada') fmt.Bur={q:q,v:v};
    if(!MEATCATS[c0]||name.indexOf('---')===0) continue;
    var n=name.toLowerCase(),hit=null;
    for(var p=0;p<PROTDEF.length;p++){
      var ks=PROTDEF[p][1];
      for(var kk=0;kk<ks.length;kk++) if(n.indexOf(ks[kk])>=0){hit=PROTDEF[p];break;}
      if(hit) break;
    }
    if(!hit){sinc.q+=q;sinc.v+=v;continue;}
    var lab=hit[0],anm=hit[2];
    if(!pa[lab]) pa[lab]={q:0,v:0,anim:anm};
    pa[lab].q+=q; pa[lab].v+=v;
    if(!an[anm]) an[anm]={q:0,v:0};
    an[anm].q+=q; an[anm].v+=v;
    if(c0==='Tacos'){ if(!tacoonly[lab]) tacoonly[lab]={q:0,v:0}; tacoonly[lab].q+=q; tacoonly[lab].v+=v; }
  }
  var cl=Object.keys(cat).map(function(k){return {k:CATNICE[k]||k,raw:k,q:cat[k].q,v:+cat[k].v.toFixed(2),
    pct:+(cat[k].v/TOT*100).toFixed(1)};}).sort(function(a,b){return b.v-a.v;});
  var acc=0; cl.forEach(function(c){acc+=c.pct;c.acc=+acc.toFixed(1);});
  D.cats=cl; D.tot_bruto_items=+TOT.toFixed(2);
  var PT=Object.keys(pa).reduce(function(s,k){return s+pa[k].v;},0);
  D.prot=Object.keys(pa).map(function(k){
    var to=(tacoonly[k]||{v:0}).v;
    return {k:k,q:pa[k].q,v:+pa[k].v.toFixed(2),pct:+(pa[k].v/PT*100).toFixed(1),anim:pa[k].anim,
      unit:+(pa[k].v/pa[k].q).toFixed(2),taco:+to.toFixed(2),mult:to?+(pa[k].v/to).toFixed(2):null};
  }).sort(function(a,b){return b.v-a.v;});
  D.anim=Object.keys(an).map(function(k){return {k:k,q:an[k].q,v:+an[k].v.toFixed(2),
    pct:+(an[k].v/PT*100).toFixed(1),unit:+(an[k].v/an[k].q).toFixed(2)};}).sort(function(a,b){return b.v-a.v;});
  D.prot_tot=+PT.toFixed(2);
  if(fmt.Taco&&fmt.Bur){
    var base=fmt.Taco.v/fmt.Taco.q;
    D.fmt=[['Taco',fmt.Taco],['Burrito chico',fmt.BCh],['Burrito',fmt.Bur]].filter(function(x){return x[1];})
      .map(function(x){var u=x[1].v/x[1].q;return {k:x[0],q:x[1].q,v:+x[1].v.toFixed(2),
        unit:+u.toFixed(2),mult:+(u/base).toFixed(2)};});
  }
  if(sal.length){
    D.salsas=sal.sort(function(a,b){return b.v-a.v;});
    var fr=sal.filter(function(s){return s.k.indexOf('Mason')>=0;});
    if(fr.length){var tq=fr.reduce(function(s,f){return s+f.q;},0);
      var ret=fr.filter(function(f){return f.k.indexOf('Retorno')>=0;})[0];
      D.frascos={total:tq,venta:+fr.reduce(function(s,f){return s+f.v;},0).toFixed(2),
        retorno:ret?ret.q:0,ratio:0,recompra_pct:ret?+(ret.q/tq*100).toFixed(1):0};}
  }
  var chips=null;
  for(var r2=1;r2<rows.length;r2++){ if((rows[r2][iN]||'').trim()==='Chips'){chips={q:pn(rows[r2][iQ]),v:pm(rows[r2][iV])};break;} }
  if(chips) D.chips=Object.assign({},D.chips,{ordenes:chips.q,venta:+chips.v.toFixed(2)});
  /* tabla completa de articulos */
  var iD=H.indexOf('Descuentos y artículos gratuitos');
  var its=[];
  for(var r3=1;r3<rows.length;r3++){
    var R3=rows[r3]; if(R3.length<=iV) continue;
    var nm=(R3[iN]||'').trim(); if(!nm||nm.indexOf('---')===0) continue;
    var q3=pn(R3[iQ]), v3=pm(R3[iV]); if(!q3&&!v3) continue;
    its.push({n:nm,c:(R3[iC]||'NA').trim(),q:q3,v:+v3.toFixed(2),u:q3?+(v3/q3).toFixed(2):0,
      d:iD>=0?+pm(R3[iD]).toFixed(2):0});
  }
  its.sort(function(a,b){return b.v-a.v;});
  D.items=its; D.top_items=its.slice(0,12);
  var acc3=0,n80=0;
  for(var z=0;z<its.length;z++){acc3+=its[z].v;n80++;if(acc3>=TOT*0.8)break;}
  D.conc={n80:n80,total:its.length,pct:+(n80/its.length*100).toFixed(1)};
}

function parsePay(txt,D){
  var rows=splitRows(txt,','); if(rows.length<2) return;
  var H=rows[0].map(function(x){return x.replace(/"/g,'').trim();});
  function ix(n){return H.indexOf(n);}
  var out=[];
  for(var i=1;i<rows.length;i++){
    var R=rows[i]; if(R.length<3) continue;
    var n=pn(R[ix('N.º de pagos')]); if(!n) continue;
    out.push({m:(R[0]||'').replace(/"/g,'').trim(),n:n,importe:pm(R[ix('Importe de pago')]),
      propinas:pm(R[ix('Propinas')]),comision:pm(R[ix('Total de comisiones (impuestos incluidos)')]),
      neto:pm(R[ix('Total neto')])});
  }
  if(!out.length) return;
  D.pay=out;
  var tp=out.reduce(function(s,p){return s+p.n;},0);
  var tar=out.filter(function(p){return /tarjeta|card/i.test(p.m)&&!/regalo|gift/i.test(p.m);})[0]||out[0];
  var efe=out.filter(function(p){return /efectivo|cash/i.test(p.m);})[0]||{n:0};
  D.pagos={tarjeta_pct:+(tar.n/tp*100).toFixed(1),efectivo_pct:+(efe.n/tp*100).toFixed(1),
    comision_sobre_tarjeta:+(Math.abs(tar.comision)/tar.importe*100).toFixed(2),
    comision_total:Math.abs(tar.comision),total_pagos:tp};

var MESN={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sept:9,sep:9,oct:10,nov:11,dic:12,
 jan:1,apr:4,aug:8,dec:12};
function parseTrend(txt,D){
  var rows=splitRows(txt,','); var meses=[],dias={},seen={};
  rows.forEach(function(R){
    if(R.length<4) return;
    [[0,1],[2,3]].forEach(function(pr){
      var lab=(R[pr[0]]||'').replace(/"/g,'').trim(), val=pm(R[pr[1]]);
      if(!lab||/^(Actual|Comparaci)/i.test(lab)) return;
      var mm=lab.match(/^([a-zé]{3,4})\.?\s+(\d{4})$/i);
      if(mm){ if(!seen['m'+lab]){seen['m'+lab]=1;meses.push({m:lab,v:+val.toFixed(2)});} return; }
      var dm=lab.match(/^(\d{1,2})\s+([a-zé]{3,4})\.?\s+(\d{4})$/i);
      if(dm){
        var mo=MESN[dm[2].toLowerCase()]; if(!mo) return;
        var d0=new Date(Date.UTC(+dm[3],mo-1,+dm[1]));
        var iso=d0.toISOString().slice(0,10);
        if(dias[iso]===undefined) dias[iso]={iso:iso,dow:(d0.getUTCDay()+6)%7,v:+val.toFixed(2)};
      }
    });
  });
  var dl=Object.keys(dias).map(function(k){return dias[k];}).sort(function(a,b){return a.iso<b.iso?-1:1;});
  if(meses.length) D.meses=meses.filter(function(x){return x.v>0;});
  if(dl.length){
    D.dias=dl;
    D.nota_dias={desde:dl[0].iso,hasta:dl[dl.length-1].iso,n:dl.length};
    var g={};
    dl.forEach(function(d){ if(d.v>0){ (g[d.dow]=g[d.dow]||[]).push(d.v);} });
    var dow=Object.keys(g).map(function(k){var a=g[k];
      return {d:+k,avg:+(a.reduce(function(s,x){return s+x;},0)/a.length).toFixed(2),n:a.length};})
      .sort(function(a,b){return a.d-b.d;});
    if(!g[6]) dow.push({d:6,avg:0,n:0,cerrado:true});
    D.dow=dow;
    var op=dow.filter(function(x){return x.avg>0;});
    if(op.length){
      D.dow_best=op.reduce(function(a,b){return b.avg>a.avg?b:a;});
      D.dow_worst=op.reduce(function(a,b){return b.avg<a.avg?b:a;});
      D.dow_gap=+(D.dow_best.avg-D.dow_worst.avg).toFixed(2);
      D.dow_gap_pct=+((D.dow_best.avg/D.dow_worst.avg-1)*100).toFixed(1);
    }
    /* ritmo: dias operativos por mes a partir del registro diario */
    var per={};
    dl.forEach(function(d){var k=d.iso.slice(0,7); per[k]=per[k]||{d:0,v:0}; if(d.v>0){per[k].d++;per[k].v+=d.v;}});
  }
  if(D.meses&&D.meses.length){
    D.ritmo=D.meses.map(function(x,i){
      var mm=x.m.match(/^([a-zé]{3,4})\.?\s+(\d{4})$/i); var days=null;
      if(mm){
        var mo=MESN[mm[1].toLowerCase()], yr=+mm[2];
        if(mo){
          var dim=new Date(Date.UTC(yr,mo,0)).getUTCDate(), sun=0;
          for(var dd=1;dd<=dim;dd++) if(new Date(Date.UTC(yr,mo-1,dd)).getUTCDay()===0) sun++;
          days=dim-sun;
        }
      }
      var key=mm?(mm[2]+'-'+('0'+MESN[mm[1].toLowerCase()]).slice(-2)):'';
      var rec=D.dias?D.dias.filter(function(z){return z.iso.slice(0,7)===key;}):[];
      var covers=rec.some(function(z){return +z.iso.slice(8)<=2;});
      var recOp=rec.filter(function(z){return z.v>0;}).length;
      var usedRec=covers&&recOp>0&&recOp<days;
      var use=usedRec?recOp:days;
      var partial=(i===0)||usedRec;
      return {m:x.m,v:x.v,dias:use||null,rate:use?+(x.v/use).toFixed(2):null,parcial:!!partial};
    });
    if(D.ritmo[0]) {D.ritmo[0].dias=null;D.ritmo[0].rate=null;D.ritmo[0].parcial=true;}
    var withRate=D.ritmo.filter(function(x){return x.rate;});
    if(withRate.length>=2) D.ritmo_delta=+((withRate[withRate.length-1].rate/withRate[0].rate-1)*100).toFixed(1);
  }
}

function embSrc(u){
  u=String(u||'').trim();
  var m=u.match(/src\s*=\s*["']([^"']+)["']/i);
  if(m)u=m[1];
  u=u.replace(/&amp;/g,'&').trim();
  if(!/^https:\/\/(www\.)?google\.[a-z.]{2,}\/maps/i.test(u)&&!/^https:\/\/maps\.google\.[a-z.]{2,}\//i.test(u))return null;
  if(u.indexOf('output=embed')<0&&u.indexOf('/maps/embed')<0)u+=(u.indexOf('?')<0?'?':'&')+'output=embed';
  return u;
}

var BN={m:'val',dom:0,mix:'same'};

function bnCalc(g){
  var b=DATA.bn, base=b.base, sh=g.tot.v/base;
  var f=(BN.mix==='tilt')?(b.tilt[g.k]||1):1;
  var pool=base*(BN.dom/100);
  var addV=(BN.dom?pool*sh*f:0);
  var addQ=addV/g.tot.u;
  var rows=[{lbl:g.lbl,tot:true,v:g.tot.v,q:g.tot.q,u:g.tot.u,av:addV,aq:addQ}];
  g.sub.forEach(function(s){
    var w=s.v/g.tot.v, sv=addV*w, sq=sv/s.u;
    rows.push({lbl:s.lbl,tot:false,v:s.v,q:s.q,u:s.u,av:sv,aq:sq});
  });
  return rows;

 ['mods','Ventas por modificador','Modifier sales'],['trend','Tendencias de venta','Sales trends'],
 ['pay','Métodos de pago','Payment methods'],['cats','Ventas por categoría','Category sales']];
function renderFileList(){
  var h=$('flist');h.innerHTML='';
  KINDS.forEach(function(k){var got=!!FILES[k[0]];
    h.appendChild(el('div','','<span>'+(L==='en'?k[2]:k[1])+'</span><span class="'+(got?'ok':'no')+'">'+
      (got?'✓ '+t('up_read'):t('up_wait'))+'</span>'));});
  $('upok').disabled=!Object.keys(FILES).length;$('upok').style.opacity=Object.keys(FILES).length?1:.4;
}
function takeFiles(list){
  var n=list.length,done=0;if(!n)return;
  Array.prototype.forEach.call(list,function(f){
    var fr=new FileReader();
    fr.onload=function(){try{var txt=decode(fr.result),kind=sniff(txt);if(kind)FILES[kind]={name:f.name,txt:txt};}catch(e){}
      if(++done===n)renderFileList();};
    fr.onerror=function(){if(++done===n)renderFileList();};
    fr.readAsArrayBuffer(f);});
}
function applyFiles(){
  var D=JSON.parse(JSON.stringify(PUB));
  try{
    if(FILES.sum)parseSum(FILES.sum.txt,D);
    if(FILES.items)parseItems(FILES.items.txt,D);
    if(FILES.mods)parseMods(FILES.mods.txt,D);
    if(FILES.pay)parsePay(FILES.pay.txt,D);
    if(FILES.trend)parseTrend(FILES.trend.txt,D);
    if(D.frascos&&D.salsa_free_tot)D.frascos.ratio=Math.round(D.salsa_free_tot/D.frascos.total);
    if(D.meses&&D.meses.length)D.period_label=D.meses[0].m+' a '+D.meses[D.meses.length-1].m;
    var ok=(D.ritmo||[]).filter(function(x){return x.dias;});
    if(ok.length){var v=0,dd=0;ok.forEach(function(x){v+=x.v;dd+=x.dias;});
      D.tot_days_est=dd;D.ticket_por_dia=+(v/dd).toFixed(2);
      D.tickets_por_dia=Math.round(D.sum.tickets*(v/D.sum.bruto)/dd);}
    D.desc={monto:Math.abs(D.sum.descuentos),tx:D.sum.tx_descuento,
      pct:+(Math.abs(D.sum.descuentos)/D.sum.bruto*100).toFixed(2)};
    DATA=D;CUSTOM=true;closeUp();render();window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){alert(L==='en'?'Could not read one of the files. The dashboard kept the published data.':
    'No se pudo leer alguno de los archivos. El panel se quedó con los datos publicados.');}
}
function openUp(){$('upl').classList.remove('hide');renderFileList();}
function closeUp(){$('upl').classList.add('hide');}
function resetData(){DATA=JSON.parse(JSON.stringify(PUB));CUSTOM=false;FILES={};closeUp();render();}

/* ---------- WIRING ---------- */
function wire(){
  $('lges').onclick=function(){L='es';render();};
  $('lgen').onclick=function(){L='en';render();};
  $('upbtn').onclick=openUp;$('upcancel').onclick=closeUp;$('upreset').onclick=resetData;$('upok').onclick=applyFiles;
  $('upl').addEventListener('click',function(e){if(e.target===this)closeUp();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeUp();});
  var dz=$('dz'),fi=$('fi');
  dz.onclick=function(){fi.click();};fi.onchange=function(){takeFiles(fi.files);};
  ['dragenter','dragover'].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.add('ov');});});
  ['dragleave','drop'].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.remove('ov');});});
  dz.addEventListener('drop',function(e){takeFiles(e.dataTransfer.files);});
  document.addEventListener('click',function(e){
    var tb=e.target.closest&&e.target.closest('.tabs button');
    if(e.target&&e.target.id==='keytog'){KEYMIN=!KEYMIN;rKey();return;}
    if(tb){PAGE=tb.getAttribute('data-p');render();window.scrollTo({top:0,behavior:'smooth'});return;}
    var g=e.target.closest&&e.target.closest('.tg button');
    if(g){VIEW[g.getAttribute('data-g')]=g.getAttribute('data-v');render();return;}
    var ddb=e.target.closest&&e.target.closest('[data-ddb]');
    if(ddb){var id=ddb.getAttribute('data-ddb');FOPEN=(FOPEN===id)?null:id;rFilters();return;}
    var chk=e.target.closest&&e.target.closest('.fli');
    if(chk){e.preventDefault();var inp=chk.querySelector('input');
      var fk=inp.getAttribute('data-f'),fv=inp.getAttribute('data-v');
      var ix=F[fk].indexOf(fv); if(ix>=0)F[fk].splice(ix,1); else F[fk].push(fv);
      renderFiltered();return;}
    var fa=e.target.closest&&e.target.closest('[data-fall]');
    if(fa){var i2=fa.getAttribute('data-fall');F[i2]=fOpts(i2).map(function(o){return o.v;});renderFiltered();return;}
    var fn=e.target.closest&&e.target.closest('[data-fnone]');
    if(fn){F[fn.getAttribute('data-fnone')]=[];renderFiltered();return;}
    var rm=e.target.closest&&e.target.closest('[data-rm]');
    if(rm){var rk=rm.getAttribute('data-rm'),rv=rm.getAttribute('data-rv');
      if(rk==='q')F.q=''; else {var j2=F[rk].indexOf(rv);if(j2>=0)F[rk].splice(j2,1);}
      renderFiltered();return;}
    if(FOPEN&&!(e.target.closest&&e.target.closest('.fdd'))){FOPEN=null;rFilters();}
    var th=e.target.closest&&e.target.closest('th.s');
    if(th){var tbl=th.getAttribute('data-tb'),k=th.getAttribute('data-sk');
      if(SORT[tbl].k===k)SORT[tbl].d*=-1;else{SORT[tbl].k=k;SORT[tbl].d=(k==='n'||k==='c'||k==='s'||k==='m')?1:-1;}
      if(tbl==='items')tableItems();else tableMods();return;}
  });
  $('qitems').oninput=function(){Q.items=this.value;tableItems();};
  $('qmods').oninput=function(){Q.mods=this.value;tableMods();};
  $('exitems').onclick=function(){csvDL('real_taqueria_articulos.csv',
    [t('it_n'),t('it_c'),t('it_q'),t('it_v'),t('it_u')],
    DATA.items.map(function(r){return [r.n,r.c,r.q,r.v,r.u];}));};
  $('exmods').onclick=function(){csvDL('real_taqueria_modificadores.csv',
    [t('md_s'),t('md_m'),t('md_q'),t('md_v')],
    DATA.mods_all.map(function(r){return [r.s,r.m,r.q,r.v];}));};
}
render();wire();
}

/* ============ GATE ============ */
(function(){
var $=function(i){return document.getElementById(i);};
var b64=function(s){var r=atob(s),a=new Uint8Array(r.length);
  for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a.buffer;};
var GT={es:{t:'Panel de Operación',s:'Este panel contiene información confidencial de Real Taquería. Escribe la clave para entrar.',
  ph:'Clave de acceso',go:'Entrar',bad:'Clave incorrecta. Escribe los cuatro dígitos sin espacios.',
  work:'Descifrando...',
  nosec:'Este archivo tiene que abrirse desde una dirección https. Si lo descargaste y lo abriste desde el computador, súbelo primero al sitio y ábrelo desde el enlace.',
  hint:'Clave temporal de cuatro dígitos. Se cambia por la definitiva antes de entregar al cliente.',
  show:'Ver clave',hide:'Ocultar',
  note:'Los datos están cifrados dentro del archivo. Sin la clave no se pueden leer, ni viendo el código fuente.'},
 en:{t:'Operations Dashboard',s:'This dashboard holds confidential Real Taquería information. Enter the key to continue.',
  ph:'Access key',go:'Enter',bad:'Wrong key. Type the four digits with no spaces.',
  work:'Decrypting...',
  nosec:'This file has to be opened from an https address. If you downloaded it and opened it from your computer, upload it to the site first and open it from the link.',
  hint:'Temporary four digit key. It gets replaced before client handoff.',
  show:'Show key',hide:'Hide',
  note:'The data is encrypted inside the file. Without the key it cannot be read, not even from the source.'}};
var GL=(navigator.language||'es').slice(0,2)==='en'?'en':'es';
function paint(){var g=GT[GL];
  $('gt').textContent=g.t;$('gs').textContent=g.s;$('gp').placeholder=g.ph;
  $('ggo').textContent=g.go;$('gnote').textContent=g.note;
  $('ghint').textContent=g.hint;
  $('geye').textContent=($('gp').type==='password')?g.show:g.hide;
  $('gles').classList.toggle('on',GL==='es');$('glen').classList.toggle('on',GL==='en');}
function clean(s){
  return String(s||'')
   .replace(/[\u200B-\u200D\uFEFF]/g,'')
   .replace(/[\u2010-\u2015\u2212]/g,'-')
   .replace(/[`'"\u201C\u201D\u2018\u2019]/g,'')
   .trim();
}
async function unlock(pw,silent){
  var g=GT[GL],msg=$('gmsg');
  pw=clean(pw);
  if(!pw){return;}
  if(!(window.crypto&&window.crypto.subtle)){
    msg.textContent=g.nosec;msg.className='gmsg bad';return;
  }
  $('ggo').disabled=true;msg.textContent=silent?'':g.work;msg.className='gmsg go';
  try{
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(ENC.s),iterations:ENC.it,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
    var obj=JSON.parse(new TextDecoder().decode(pt));
    try{sessionStorage.setItem('rt_k',pw);}catch(e){}
    $('gate').remove();
    document.getElementById('app').style.display='';
    BOOT(obj.D,obj.I);
  }catch(e){
    $('ggo').disabled=false;
    if(silent){try{sessionStorage.removeItem('rt_k');}catch(x){}msg.textContent='';return;}
    msg.textContent=g.bad;msg.className='gmsg bad';
    $('gp').value='';$('geye').onclick=function(){var i=$('gp');i.type=(i.type==='password')?'text':'password';paint();i.focus();};
$('gp').focus();
    $('gcard').classList.remove('shake');void $('gcard').offsetWidth;$('gcard').classList.add('shake');
  }
}
paint();
$('gles').onclick=function(){GL='es';paint();};
$('glen').onclick=function(){GL='en';paint();};
$('gform').onsubmit=function(e){e.preventDefault();unlock($('gp').value.trim(),false);};
$('geye').onclick=function(){var i=$('gp');i.type=(i.type==='password')?'text':'password';paint();i.focus();};
$('gp').focus();
var saved=null;try{saved=sessionStorage.getItem('rt_k');}catch(e){}
if(saved)unlock(saved,true);
})();
